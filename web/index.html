  <div class="window">
    <div class="titlebar">
      <svg class="app-icon"><use href="#i-briefcase"/></svg>
      <div class="title">Job Agent &mdash; Handshake</div>
      <div class="caption">
        <button title="Refresh this page" aria-label="Refresh this page" id="refreshBtn">&#8635;</button>
      </div>
    </div>

    <div class="addressbar">
      <div class="navbtns">
        <button class="orb" title="Back" aria-label="Back" onclick="history.back()">&#9664;</button>
        <button class="orb" title="Forward" aria-label="Forward" onclick="history.forward()">&#9654;</button>
      </div>
      <div class="crumbs" id="crumbs" aria-label="Location"></div>
      <input class="search" id="globalSearch" type="search" placeholder="Search jobs and companies" aria-label="Search jobs and applications by company, role or location (press Enter)" title="Press Enter to search jobs and applications">
    </div>

    <div class="client">
      <div class="cmdbar">
        <button id="runBtn"><svg class="icon" style="width:16px;height:16px" aria-hidden="true"><use href="#i-play"/></svg><span class="lg">Run search now</span><span class="sm">Search</span></button>
        <button class="hide-phone" onclick="location.hash='#/queue'">Review queue</button>
        <button id="gmailBtn" class="gmail-btn" title="Open your Handshake Gmail in a new tab"><svg class="icon" style="width:16px;height:16px" aria-hidden="true" viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="2" fill="#fff" stroke="#b3261e"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5" fill="none" stroke="#d93025" stroke-width="2" stroke-linejoin="round"/></svg><span class="lg">Open Gmail</span><span class="sm">Gmail</span><span class="badge" id="gmailBadge" hidden></span></button>

        <button id="sheetBtn" style="display:none" title="Open your application log in Google Sheets"><svg class="icon" style="width:16px;height:16px" aria-hidden="true"><use href="#i-sheets"/></svg><span class="lg">Open Google Sheet</span><span class="sm">Sheet</span></button>
        <div class="spacer"></div>
        <span class="status-text" id="runStatus" aria-live="polite"></span>
        <button id="themeToggle" class="theme-toggle" type="button" aria-pressed="false" title="Switch to Aero dark"><svg class="icon" style="width:16px;height:16px" aria-hidden="true"><use href="#i-moon"/></svg><span>Dark</span></button>
      </div>
      <div class="infobar" id="demoBar" style="display:none">
        <span aria-hidden="true">&#9888;</span>
        <span>You're looking at <b>sample data</b> so you can preview the dashboard.</span>
        <button class="linkbtn" id="clearDemo">Clear sample data</button>
      </div>
      <div class="body">
        <nav class="navpane" id="nav" aria-label="Pages">
          <h4>Job Agent</h4>
          <a href="#/overview" data-page="overview"><svg class="icon"><use href="#i-home"/></svg><span class="lg">Overview</span><span class="sm">Home</span></a>
          <a href="#/queue" data-page="queue"><svg class="icon"><use href="#i-queue"/></svg><span class="lg">Approval Queue</span><span class="sm">Queue</span><span class="count" id="queueCount" hidden>0</span></a>
          <a href="#/applications" data-page="applications"><svg class="icon"><use href="#i-list"/></svg><span class="lg">Applications</span><span class="sm">Applied</span></a>
          <a href="#/resumes" data-page="resumes"><svg class="icon"><use href="#i-doc"/></svg><span class="lg">Resumes &amp; Transcript</span><span class="sm">Resumes</span></a>
          <a href="#/facts" data-page="facts"><svg class="icon"><use href="#i-star"/></svg><span class="lg">Career Facts</span><span class="sm">Facts</span><span class="count" id="factCount" hidden>0</span></a>
          <a href="#/github" data-page="github"><svg class="icon"><use href="#i-code"/></svg><span class="lg">GitHub</span><span class="sm">GitHub</span></a>
          <div class="divider"></div>
          <h4>Agent</h4>
          <a href="#/handshake" data-page="handshake"><svg class="icon" aria-hidden="true"><use href="#i-handshake"/></svg><span class="lg">Handshake</span><span class="sm">Handshake</span></a>
          <a href="#/settings" data-page="settings"><svg class="icon"><use href="#i-gear"/></svg><span class="lg">Settings</span><span class="sm">Settings</span></a>
          <a href="#/activity" data-page="activity"><svg class="icon"><use href="#i-pulse"/></svg><span class="lg">Activity Log</span><span class="sm">Activity</span></a>

      </div>

      <div class="titlebar"><div class="title" id="dlgCaption">Job Agent</div></div>
      <div class="dlg-client">
        <div class="dlg-main">
          <svg class="big-icon" id="dlgIcon" aria-hidden="true"><use href="#i-info"/></svg>
          <div><h3 id="dlgTitle"></h3><div id="dlgBody"></div></div>
        </div>
        <div class="dlg-foot">
          <button class="btn primary" id="dlgOk">OK</button>
          <button class="btn" id="dlgCancel">Cancel</button>
        </div>
      </div>
    </div>
